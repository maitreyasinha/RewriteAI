name: Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release DMG
    runs-on: macos-14 # Apple Silicon M-series runner on GitHub Actions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Build macOS App Archive
        run: |
          # Locate project or workspace
          if [ -d "App/RewriteAI.xcworkspace" ]; then
            TARGET_FLAG="-workspace App/RewriteAI.xcworkspace"
          elif [ -d "App/RewriteAI.xcodeproj" ]; then
            TARGET_FLAG="-project App/RewriteAI.xcodeproj"
          elif [ -d "RewriteAI.xcodeproj" ]; then
            TARGET_FLAG="-project RewriteAI.xcodeproj"
          else
            PROJ_PATH=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
            TARGET_FLAG="-project $PROJ_PATH"
          fi

          echo "Target flag: $TARGET_FLAG"

          # Build and archive using Release scheme
          xcodebuild $TARGET_FLAG \
            -scheme RewriteAI \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -archivePath build/RewriteAI.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package .dmg with Applications shortcut
        run: |
          mkdir -p build/dmg_root

          # Locate built .app bundle inside the archive
          APP_PATH=$(find build/RewriteAI.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found in archive"
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/dmg_root/

          # Add link to /Applications for drag-and-drop installer
          ln -s /Applications build/dmg_root/Applications

          # Create compressed DMG image using native macOS hdiutil
          hdiutil create \
            -volname "RewriteAI" \
            -srcfolder build/dmg_root \
            -ov \
            -format UDZO \
            RewriteAI.dmg

          echo "Generated DMG:"
          ls -lh RewriteAI.dmg

      - name: Create GitHub Release and Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name || inputs.tag_name }}
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: RewriteAI.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
